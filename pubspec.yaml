name: inside_scoop
description: "A new Flutter plugin project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.15.0
  plugin_platform_interface: ^2.0.2
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^30.0.3

flutter:
  plugin:
    platforms:
      android:
        package: com.cavernlabs.inside.scoop.inside_scoop
        pluginClass: InsideScoopPlugin
      ios:
        pluginClass: InsideScoopPlugin
      linux:
        pluginClass: InsideScoopPlugin
      macos:
        pluginClass: InsideScoopPlugin
      windows:
        pluginClass: InsideScoopPluginCApi
      web:
        pluginClass: InsideScoopWeb
        fileName: inside_scoop_web.dart
